<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regirstration</title>
    <link rel="stylesheet" href="../index.css" />
  </head>
  <body>
    <button id="open-dialog" type="button">Event Registeration</button>
    <dialog id="event_register_dialog" aria-labelledby="membership-title">
      <div class="regstration-form">
        <button class="btn-close" type="button" aria-label="Close membership registration">
          <img src="../assests/imgs/icons/ic_close.svg" alt="" />
        </button>
        <h1 id="membership-title">Membership Registeration</h1>
        <form action="" class="form">
          <div class="form-item">
            <label for="membership-name">Full Name*</label>
            <input
              type="text"
              name="name"
              id="membership-name"
              class="text-field"
              placeholder="Name"
              required
            />
          </div>

          <div class="form-item">
            <label for="membership-email">Email*</label>
            <input
              type="email"
              name="name"
              id="membership-email"
              class="text-field"
              placeholder="hi@example.com"
              required
            />
          </div>

          <div class="form-item">
            <label for="membership-phone">Phone Number*</label>
            <input
              type="text"
              name="name"
              id="membership-phone"
              class="text-field"
              placeholder="XXXXXXXXX"
              required
            />
          </div>

          <div class="form-item">
            <label for="membership-code">Membership Number</label>
            <input
              type="text"
              name="name"
              id="membership-code"
              class="text-field"
              placeholder="XXXXXXXXX"
              required
            />
          </div>

          <div class="form-item">
            <span class="form-label">Payment Method</span>
            <div class="payment-item">
              <input type="radio" name="payment_method" id="membership-paypal" />
              <label for="membership-paypal">PayPal</label>
            </div>

            <div class="payment-item">
              <input type="radio" name="payment_method" id="membership-banking" />
              <label for="membership-banking">Banking</label>
            </div>
          </div>

          <input type="submit" value="Register" class="btn-primary" />
        </form>
      </div>
    </dialog>

    <script src="../index.js"></script>
  </body>
</html>
