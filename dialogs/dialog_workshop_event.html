<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regirstration</title>
    <link rel="stylesheet" href="../index.css" />
  </head>
  <body>
    <button id="open-dialog">Event Registeration</button>
    <dialog id="event_register_dialog" aria-labelledby="workshop-title">
    <div class="regstration-form">
      <button class="btn-close" type="button" aria-label="Close event registration"><img src="../assests/imgs/icons/ic_close.svg" alt=""></button>
      <h1 id="workshop-title">Event Registeration</h1>
      <form action="" class="form">
        <div class="form-item">
          <label for="workshop-name">Full Name*</label>
          <input type="text" name="name" id="workshop-name" class="text-field" placeholder="Name" required/>
        </div>

        <div class="form-item">
          <label for="workshop-email">Email*</label>
          <input type="email" name="email" id="workshop-email" class="text-field" placeholder="hi@example.com" required/>
        </div>

        <div class="form-item">
          <label for="workshop-phone">Phone Number*</label>
          <input type="text" name="phone" id="workshop-phone" class="text-field" placeholder="XXXXXXXXX" required/>
        </div>

        <div class="form-item">
          <label for="workshop-membership">Membership Number (if member)</label>
          <input type="text" name="membership_number" id="workshop-membership" class="text-field" placeholder="0FJX7OPA99"/>
        </div>

        <div class="form-item">
          <label for="workshop-message">Any suggestion or message (optional)</label>
          <textarea name="message" id="workshop-message" class="text-field" placeholder="Suggestion"></textarea>
        </div>

        <input type="submit" value="Register" class="btn-primary" />
      </form>
    </div>
    </dialog>

    <script src="../index.js"></script>
  </body>
</html>
